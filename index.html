<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carta</title>
  
  <!-- Fuente cursiva elegante (Handwritten style) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* --- Pantalla de Inicio con Texto Manuscrito --- */
    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.96);
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
      text-align: center;
      cursor: pointer;
      transition: opacity 1s ease, visibility 1s ease;
    }

    #overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #overlay h2 {
      font-family: 'Dancing Script', cursive;
      font-size: 2.2rem;
      font-weight: 700;
      color: #f3e5ab; /* Tono cálido tipo pergamino */
      text-shadow: 0 0 12px rgba(243, 229, 171, 0.5), 0 0 25px rgba(255, 255, 255, 0.2);
      line-height: 1.4;
      animation: pulseGlow 2.5s infinite ease-in-out;
    }

    @keyframes pulseGlow {
      0%, 100% {
        opacity: 0.65;
        transform: scale(0.98);
        text-shadow: 0 0 8px rgba(243, 229, 171, 0.3);
      }
      50% {
        opacity: 1;
        transform: scale(1.02);
        text-shadow: 0 0 18px rgba(243, 229, 171, 0.8), 0 0 30px rgba(255, 255, 255, 0.4);
      }
    }

    /* --- Fondo: Relámpagos y Lluvia --- */
    #lightning {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(255, 255, 255, 0.85);
      opacity: 0;
      pointer-events: none;
      z-index: 1;
      transition: opacity 0.05s ease;
    }

    #rain-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 2;
    }

    .drop {
      position: absolute;
      background: linear-gradient(transparent, rgba(255, 255, 255, 0.4));
      width: 1px;
      height: 50px;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% { transform: translateY(-100px); }
      100% { transform: translateY(100vh); }
    }

    /* --- Contenedor Principal --- */
    .viewport {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
      padding: 20px;
      max-width: 440px;
      width: 90%;
    }

    .paper-container {
      perspective: 1000px;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    /* --- Animación de Caída y Rebote de la Bola --- */
    .bounce-in {
      animation: bounceWall 1.2s cubic-bezier(0.215, 0.610, 0.355, 1.000) both;
    }

    @keyframes bounceWall {
      0% {
        opacity: 0;
        transform: translate3d(-300px, -200px, 0) scale(0.2) rotate(-180deg);
      }
      60% {
        opacity: 1;
        transform: translate3d(40px, 20px, 0) scale(0.35) rotate(30deg);
      }
      75% {
        transform: translate3d(-15px, -10px, 0) scale(0.32) rotate(-10deg);
      }
      90% {
        transform: translate3d(5px, 5px, 0) scale(0.35) rotate(5deg);
      }
      100% {
        transform: translate3d(0, 0, 0) scale(0.35) rotate(0deg);
      }
    }

    /* --- Estilos del Papel --- */
    .paper {
      width: 100%;
      cursor: pointer;
      transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), filter 0.4s ease, border-radius 0.4s ease;
      user-select: none;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      background: #e1d3be;
      border-radius: 50%;
    }

    .paper img {
      width: 100%;
      height: auto;
      border-radius: 6px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
      transition: opacity 0.3s ease;
      display: block;
    }

    .paper::after {
      content: 'Toca para desdoblar';
      position: absolute;
      bottom: -22px;
      color: rgba(255, 255, 255, 0.75);
      font-size: 12px;
      letter-spacing: 1px;
      text-shadow: 0 2px 4px #000;
      white-space: nowrap;
    }
    .fold-stage-7::after {
      display: none;
    }

    /* --- ETAPAS DE DESDOBLAMIENTO --- */
    .fold-stage-0 {
      filter: brightness(0.85);
      border-radius: 45%;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 0 15px rgba(255,255,255,0.2);
    }
    .fold-stage-0 img { opacity: 0.7; }

    .fold-stage-1 { transform: scale(0.45) rotate(15deg) rotateX(50deg); filter: brightness(0.88); border-radius: 35%; }
    .fold-stage-1 img { opacity: 0.8; }

    .fold-stage-2 { transform: scale(0.55) rotate(-10deg) rotateX(38deg); filter: brightness(0.9); border-radius: 25%; }
    .fold-stage-2 img { opacity: 0.85; }

    .fold-stage-3 { transform: scale(0.65) rotate(6deg) rotateX(26deg); filter: brightness(0.93); border-radius: 18%; }
    .fold-stage-3 img { opacity: 0.9; }

    .fold-stage-4 { transform: scale(0.75) rotate(-4deg) rotateX(16deg); filter: brightness(0.96); border-radius: 12%; }
    .fold-stage-4 img { opacity: 0.93; }

    .fold-stage-5 { transform: scale(0.85) rotate(2deg) rotateX(8deg); filter: brightness(0.98); border-radius: 8%; }
    .fold-stage-5 img { opacity: 0.96; }

    .fold-stage-6 { transform: scale(0.94) rotate(-1deg) rotateX(3deg); border-radius: 4%; }
    .fold-stage-6 img { opacity: 0.98; }

    .fold-stage-7 {
      transform: scale(1) rotate(0deg) rotateX(0deg) !important;
      filter: blur(0) brightness(1);
      border-radius: 4px;
      background: transparent;
    }
    .fold-stage-7 img { opacity: 1; }
  </style>
</head>
<body>

  <!-- Overlay de Inicio con Fuente Manuscrita -->
  <div id="overlay" onclick="startExperience()">
    <h2>Toca si quieres saber la verdad, Mitca...</h2>
  </div>

  <!-- Capas de Lluvia y Relámpagos -->
  <div id="lightning"></div>
  <div id="rain-container"></div>

  <!-- Cartas en el Orden Correcto -->
  <main class="viewport">
    
    <!-- PRIMERA CARTA (ARRIBA): carta-1.jpg -->
    <div class="paper-container">
      <div class="paper fold-stage-0" id="carta1_el" onclick="unfold(this)">
        <img src="carta2.jpg" alt="Carta Parte 1">
      </div>
    </div>

    <!-- SEGUNDA CARTA (ABAJO): carta-2.jpg -->
    <div class="paper-container">
      <div class="paper fold-stage-0" id="carta2_el" onclick="unfold(this)">
        <img src="carta1.jpg" alt="Carta Parte 2">
      </div>
    </div>

  </main>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let isStarted = false;

    function startExperience() {
      if (isStarted) return;
      isStarted = true;

      // Ocultar pantalla de inicio
      document.getElementById('overlay').classList.add('hidden');

      // Activar AudioContext
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      // Iniciar lluvia suave
      startCalmRainSound();

      // Animación de caída de cartas
      document.getElementById('carta1_el').classList.add('bounce-in');
      setTimeout(() => {
        document.getElementById('carta2_el').classList.add('bounce-in');
      }, 300);
    }

    /* --- Lluvia Tranquila --- */
    function startCalmRainSound() {
      const bufferSize = audioCtx.sampleRate * 2;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }

      const whiteNoise = audioCtx.createBufferSource();
      whiteNoise.buffer = buffer;
      whiteNoise.loop = true;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(450, audioCtx.currentTime);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.04, audioCtx.currentTime);

      whiteNoise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);

      whiteNoise.start();
    }

    /* --- Trueno Distante --- */
    function playThunderSound() {
      if (!isStarted) return;

      const bufferSize = audioCtx.sampleRate * 1.8;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(120, audioCtx.currentTime);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.7);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);

      noise.start();
    }

    /* --- Sonido Crujiente al Desdoblar --- */
    function playPaperSound() {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      const bufferSize = audioCtx.sampleRate * 0.12;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }

      const whiteNoise = audioCtx.createBufferSource();
      whiteNoise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(1000 + Math.random() * 600, audioCtx.currentTime);
      filter.Q.setValueAtTime(1.2, audioCtx.currentTime);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.11);

      whiteNoise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);

      whiteNoise.start();
    }

    /* --- Desdoblamiento --- */
    function unfold(element) {
      element.classList.remove('bounce-in');

      let currentStage = 0;
      for (let i = 0; i <= 7; i++) {
        if (element.classList.contains(`fold-stage-${i}`)) {
          currentStage = i;
          break;
        }
      }

      if (currentStage < 7) {
        playPaperSound();
        element.classList.remove(`fold-stage-${currentStage}`);
        element.classList.add(`fold-stage-${currentStage + 1}`);
      }
    }

    /* --- Lluvia Visal --- */
    function createRain() {
      const container = document.getElementById('rain-container');
      const dropCount = 70;

      for (let i = 0; i < dropCount; i++) {
        const drop = document.createElement('div');
        drop.classList.add('drop');
        drop.style.left = `${Math.random() * 100}vw`;
        drop.style.animationDuration = `${0.6 + Math.random() * 0.5}s`;
        drop.style.animationDelay = `${Math.random() * 2}s`;
        drop.style.opacity = Math.random() * 0.6;
        container.appendChild(drop);
      }
    }

    /* --- Relámpagos Aleatorios --- */
    function triggerLightning() {
      const lightning = document.getElementById('lightning');
      
      function flash() {
        if (isStarted) {
          lightning.style.opacity = '0.85';
          playThunderSound();
          setTimeout(() => { lightning.style.opacity = '0'; }, 60);

          if (Math.random() > 0.5) {
            setTimeout(() => {
              lightning.style.opacity = '0.5';
              setTimeout(() => { lightning.style.opacity = '0'; }, 40);
            }, 90);
          }
        }

        const nextFlash = Math.random() * 7000 + 4000;
        setTimeout(flash, nextFlash);
      }

      flash();
    }

    window.onload = () => {
      createRain();
      triggerLightning();
    };
  </script>
</body>
</html>
